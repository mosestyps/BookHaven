---
- name: Ensure Docker is installed (for image pulls)
  apt:
    name: docker.io
    state: present
    update_cache: yes
  tags:
    - backend

- name: Confirm backend image is pullable from Docker Hub
  shell: docker pull {{ backend_image }}
  register: backend_pull_result
  changed_when: "'Downloaded newer image' in backend_pull_result.stdout"
  tags:
    - backend
